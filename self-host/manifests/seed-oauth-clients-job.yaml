apiVersion: batch/v1
kind: Job
metadata:
  name: ${APP_PREFIX}-seed-oauth-clients
  namespace: ${NAMESPACE}
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: ${PLATFORM_IMAGE_PREFIX}-cp:${IMAGE_TAG}
          command: ["node", "dist/seed-oauth-clients.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${APP_PREFIX}-pg-user
                  key: connection-url
            # Empty for disabled modules — the seed script skips those clients.
            - name: SANDBOX_OAUTH_REDIRECT_URI
              value: "${SANDBOX_OAUTH_REDIRECT_URI}"
            - name: BROWSER_OAUTH_REDIRECT_URI
              value: "${BROWSER_OAUTH_REDIRECT_URI}"
