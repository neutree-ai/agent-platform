apiVersion: batch/v1
kind: Job
metadata:
  name: ${APP_PREFIX}-seed-admin
  namespace: ${NAMESPACE}
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: ${PLATFORM_IMAGE_PREFIX}-cp:${IMAGE_TAG}
          command: ["node", "dist/seed-admin.js"]
          args:
            - "--username"
            - "${ADMIN_USERNAME}"
            - "--password"
            - "${ADMIN_PASSWORD}"
            - "--display-name"
            - "${ADMIN_DISPLAY_NAME}"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${APP_PREFIX}-pg-user
                  key: connection-url
