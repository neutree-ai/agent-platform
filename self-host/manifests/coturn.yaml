# TURN server for WebRTC relay (browser sandbox live view).
# hostNetwork=true so external browsers and internal pods reach the same address.
# TURN_AUTH_SECRET is read from ${APP_PREFIX}-browser-secret (already created by secrets.yaml).
#
# Connected variant: pulled straight from Docker Hub's public coturn image.
#
# install.sh patches nodeSelector at apply time and resolves TURN_HOST from this
# pod's hostIP if the operator left it blank in values.env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: ${NAMESPACE}
  labels:
    app: coturn
spec:
  replicas: 1
  # hostNetwork + fixed port — RollingUpdate deadlocks on re-apply because
  # the new pod can't bind until the old one releases the port.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: coturn
          image: ${COTURN_IMAGE}
          args:
            - "--listening-port=3478"
            # Pin to a single IP. Without --listening-ip coturn enumerates
            # every host interface — including kube-ipvs0 / CNI dummy
            # interfaces carrying Service ClusterIPs that reject bind() with
            # EADDRNOTAVAIL.
            #
            # Bind and advertise are separate addresses: ${TURN_BIND_IP} has to
            # exist on this node's NIC, while ${TURN_HOST} is whatever browsers
            # dial. They are the same value on a LAN node, and behind 1:1 NAT
            # (a cloud VM's public IP) they are not — binding the public one
            # there fails with EADDRNOTAVAIL. install.sh defaults TURN_BIND_IP
            # to TURN_HOST and folds both into ${TURN_EXTERNAL_IP}.
            - "--listening-ip=${TURN_BIND_IP}"
            - "--relay-ip=${TURN_BIND_IP}"
            - "--external-ip=${TURN_EXTERNAL_IP}"
            - "--min-port=49152"
            - "--max-port=49252"
            - "--realm=${NAP_HOST}"
            - "--use-auth-secret"
            - "--static-auth-secret=$(TURN_AUTH_SECRET)"
            - "--no-tls"
            - "--no-dtls"
            - "--log-file=stdout"
            - "--fingerprint"
            - "--lt-cred-mech"
            - "--no-cli"
            - "--no-multicast-peers"
          env:
            - name: TURN_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: ${APP_PREFIX}-browser-secret
                  key: TURN_AUTH_SECRET
          ports:
            - name: turn-tcp
              containerPort: 3478
              protocol: TCP
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
          # coturn exits 255 when it cannot bind, and a bare Deployment reports
          # the CrashLoop as 1/1 Running between restarts — one install ran a
          # dead relay for months without a single failing signal. The probe
          # makes an unbindable address show up as a failed rollout instead.
          readinessProbe:
            tcpSocket:
              port: 3478
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: coturn
  namespace: ${NAMESPACE}
spec:
  selector:
    app: coturn
  clusterIP: None
  ports:
    - name: turn-tcp
      port: 3478
      targetPort: 3478
      protocol: TCP
